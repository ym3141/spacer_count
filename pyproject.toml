[project]
name = "spacer-count"
version = "0.2.2b1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "biopython>1.84",
    "maturin>=1.12.6",
    "pandas>2.2",
]

[build-system]
requires = ["maturin>=1.12,<2.0"]
build-backend = "maturin"

# For uv to rebuild with maturin if any of these files change
[tool.uv]
cache-keys = [{file = "pyproject.toml"}, {file = "Cargo.toml"}, {file = "**/*.rs"}]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
]

[project.scripts]
spacer-count = "spacer_count.CLI:main"

[tool.pytest.ini_options]
pythonpath = [
  ".", "src",
]

[tool.setuptools.packages.find]
include = ["spacer_count*"]
exclude = ["data*", 'tests*']

